name: CI & Deployment

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  # Typecheck/lint/unit-tests/build need no Supabase/Docker/Playwright at
  # all - they used to run inside quality-gate *after* the Supabase stack
  # start, wasting that stack's ~10-15s startup on steps that never touch
  # it. Runs as its own job so it starts immediately in parallel with
  # quality-gate instead of serially after it.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      # Firebase emulators (Firestore/Storage rules runtime) need a JVM.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Security rules + Firestore storage service, end to end.
      - name: Emulator tests (rules + storage service)
        run: npm run test:emulator

      # Re-run (not just checks' copy): only here is the Auth emulator up,
      # so this is the one run that actually exercises the auth-gated
      # /api/ai/* cases in tests/unit/server.routes.test.ts.
      - name: Unit tests (live Auth emulator)
        run: >-
          npx firebase emulators:exec --only auth --project demo-gran-cru
          "FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 FIREBASE_PROJECT_ID=demo-gran-cru npm run test:unit"

      - name: E2E tests
        env:
          VITE_FIREBASE_USE_EMULATOR: "true"
          VITE_FIREBASE_PROJECT_ID: demo-gran-cru
          VITE_FIREBASE_STORAGE_BUCKET: demo-gran-cru.appspot.com
        run: >-
          npx firebase emulators:exec --only auth,firestore,storage --project demo-gran-cru
          "npm run test:ui"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/ui-baseline/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Note: deployment to Firebase (Hosting + Cloud Function + rules) is a
  # manual `npm run deploy` for now - see docs/FIREBASE_SETUP.md.
