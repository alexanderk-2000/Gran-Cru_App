name: CI & Deployment

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  # Typecheck/lint/unit-tests/build need no Supabase/Docker/Playwright at
  # all - they used to run inside quality-gate *after* the Supabase stack
  # start, wasting that stack's ~10-15s startup on steps that never touch
  # it. Runs as its own job so it starts immediately in parallel with
  # quality-gate instead of serially after it.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install Supabase CLI
        run: npm install --global supabase@latest

      - name: Start local Supabase stack
        run: supabase start -x studio,edge-runtime,imgproxy,logflare,vector,pgadmin-schema-diff,migra,realtime

      - name: Run RLS tests (pgTAP)
        run: supabase test db

      - name: Configure environment from local Supabase
        run: |
          supabase status -o env \
            --override-name api.url=VITE_SUPABASE_URL \
            --override-name auth.anon_key=VITE_SUPABASE_ANON_KEY \
            >> .env.local
          mkdir -p server
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_ANON_KEY \
            >> server/.env

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Re-run (not just checks' copy): only here is SUPABASE_URL/ANON_KEY
      # populated, so this is the one run that actually exercises the
      # auth-gated /api/ai/* cases in tests/unit/server.routes.test.ts
      # against a real session instead of skipping them.
      - name: Unit tests (live Supabase)
        run: npm run test:unit

      - name: E2E tests
        run: npm run test:ui

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/ui-baseline/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  # Note: Vercel deployment is handled automatically by the Vercel-GitHub integration.
  # This workflow ensures that the code passing the 'quality-gate' is what gets deployed.
  # If quality-gate fails, the push is still there, but you'll see a red cross in GitHub.
