name: CI & Deployment

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        run: npm install --global supabase@latest

      - name: Start local Supabase stack
        run: supabase start -x studio,edge-runtime,imgproxy,logflare,vector,pgadmin-schema-diff,migra,realtime

      - name: Run RLS tests (pgTAP)
        run: supabase test db

      - name: Configure environment from local Supabase
        run: |
          supabase status -o env \
            --override-name api.url=VITE_SUPABASE_URL \
            --override-name auth.anon_key=VITE_SUPABASE_ANON_KEY \
            >> .env.local
          mkdir -p server
          touch server/.env

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Quality Gate (CI Check)
        run: npm run ci:check

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/ui-baseline/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  # Note: Vercel deployment is handled automatically by the Vercel-GitHub integration.
  # This workflow ensures that the code passing the 'quality-gate' is what gets deployed.
  # If quality-gate fails, the push is still there, but you'll see a red cross in GitHub.
