name: CI & Deployment

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create fallback .env files
        run: |
          touch .env.local
          mkdir -p server
          touch server/.env

      - name: Run Quality Gate (CI Check)
        run: npm run ci:check

  # Note: Vercel deployment is handled automatically by the Vercel-GitHub integration.
  # This workflow ensures that the code passing the 'quality-gate' is what gets deployed.
  # If quality-gate fails, the push is still there, but you'll see a red cross in GitHub.
