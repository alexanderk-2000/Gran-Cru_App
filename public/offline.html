<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | Grand Cru Vault</title>
    <style>
      body {
        margin: 0;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fdfbf7;
        color: #1f1f1f;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(560px, 92vw);
        background: #ffffff;
        border: 1px solid rgba(91, 30, 45, 0.15);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 10px 30px rgba(91, 30, 45, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        color: #5b1e2d;
      }
      p {
        margin: 0;
        color: #555;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Aktuell offline</h1>
      <p>
        Grand Cru Vault ist nicht erreichbar. Sobald wieder eine Verbindung besteht,
        kannst du wie gewohnt weiterarbeiten.
      </p>
    </main>
  </body>
</html>
